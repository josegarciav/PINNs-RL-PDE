site_name: pinnrl
site_description: Physics-informed neural networks for forward and inverse PDE problems, evaluated against numerical references
site_url: https://josegarciav.github.io/PINNs-RL-PDE
repo_url: https://github.com/josegarciav/PINNs-RL-PDE
repo_name: josegarciav/PINNs-RL-PDE

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

# The linkedin drafts live under docs/ but are not part of the site.
exclude_docs: |
  linkedin/

# With `mkdocs build --strict` every one of these is an error: a page that is not in the
# navigation, a link to a file or a heading that does not exist, an absolute link.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [pinnrl]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            separate_signature: true
            heading_level: 2
            docstring_options:
              warn_missing_types: false

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Start:
    - Getting started: getting_started.md
    - When to use a PINN: when_to_use.md
    - Concepts: concepts.md
    - Equations: equations.md
  - Guides:
    - Custom equations: custom_equations.md
    - Training: training.md
    - Inverse problems: inverse_problems.md
    - Process twins: process_twins.md
    - Datasets (The Well): datasets.md
    - Dashboard: dashboard.md
    - Applications: applications.md
    - Troubleshooting: troubleshooting.md
  - Theory:
    - Overview: theory/index.md
    - Well-posedness and stability: theory/well_posedness.md
    - Identifiability and conditioning: theory/identifiability.md
    - The Bayesian view and uncertainty: theory/bayesian.md
    - The numerical-analysis bridge: theory/numerical_analysis.md
    - Equivalence regions and swarm sampling: theory/equivalence_regions.md
  - Engine: engine.md
  - Benchmarks: benchmarks.md
  - Reference:
    - Command line: reference/cli.md
    - Configuration file: reference/config.md
    - Environment variables: reference/environment.md
    - API:
      - Overview: api/index.md
      - Configuration: api/config.md
      - Neural networks: api/neural_networks.md
      - PDEs: api/pdes.md
      - Training: api/training.md
      - Native engine: api/native.md
      - RL sampler: api/rl.md
      - Plots: api/plots.md
      - Benchmarks: api/benchmarks.md
      - Analysis: api/analysis.md
      - Uncertainty: api/uq.md
      - Process models: api/process.md
      - Datasets: api/datasets.md
      - Command-line entry points: api/cli.md
  - Project:
    - Roadmap: roadmap.md
    - What has been built: history.md
    - Research program: research.md
    - Software paper: paper.md
