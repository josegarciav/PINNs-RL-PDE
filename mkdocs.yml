site_name: pinnrl
site_description: Physics-informed neural networks for forward and inverse PDE problems, evaluated against numerical references
site_url: https://josegarciav.github.io/PINNs-RL-PDE
repo_url: https://github.com/josegarciav/PINNs-RL-PDE
repo_name: josegarciav/PINNs-RL-PDE

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [pinnrl]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            separate_signature: true
            heading_level: 2
            docstring_options:
              warn_missing_types: false

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Concepts: concepts.md
  - Equations: equations.md
  - Guides:
    - Training: training.md
    - Inverse problems: inverse_problems.md
    - Datasets (The Well): datasets.md
    - Dashboard: dashboard.md
    - Benchmarks: benchmarks.md
  - Applications: applications.md
  - Research program: research.md
  - Roadmap: roadmap.md
  - API reference:
    - Overview: api/index.md
    - Configuration: api/config.md
    - Neural networks: api/neural_networks.md
    - PDEs: api/pdes.md
    - Training: api/training.md
    - RL sampler: api/rl.md
    - Plots: api/plots.md
    - Benchmarks: api/benchmarks.md
