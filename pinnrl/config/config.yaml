# PINN Configuration with PDE-specific settings
# Configuration file for Physics-Informed Neural Networks

# Device Configuration
device: "mps"  # Options: "mps", "cuda", "cpu"; an unavailable backend falls back to cpu

# Architecture-specific configurations
architectures:
  feedforward:
    hidden_dims: [128, 128, 128, 128, 128, 128, 128]  # 7 hidden layers by default
    activation: "tanh"
    dropout: 0.0  # No dropout for PINN training (dropout hurts PDE residual convergence)
    layer_norm: true

  resnet:
    hidden_dim: 512
    num_blocks: 7  # 7 residual blocks by default
    activation: "tanh"
    dropout: 0.0  # No dropout for PINN training

  siren:
    hidden_dims: [124, 124, 124, 124, 124, 124, 124]
    omega_0: 30.0  # Frequency parameter for sin activation

  fourier:
    mapping_size: 512  # B has shape (input_dim, mapping_size); features are [sin(xB), cos(xB)]
    hidden_dims: [512, 512, 512, 512]  # one hidden layer per entry (4 here), then the output layer
    scale: 4.0  # B ~ N(0, scale^2); larger captures higher frequencies
    activation: "tanh"
    dropout: 0.0  # not read by FourierNetwork
    layer_norm: true  # not read by FourierNetwork

  attention:
    hidden_dim: 124
    num_layers: 4  # 4 attention blocks by default
    num_heads: 4  # 4 attention heads per block
    dropout: 0.0  # No dropout for PINN training
    activation: "gelu"

  autoencoder:
    latent_dim: 64  # Dimension of the latent space
    hidden_dims: [124, 248, 124]  # Encoder widths; the decoder mirrors them: in -> 124-248-124 -> latent -> 124-248-124 -> out
    activation: "relu"
    dropout: 0.0  # No dropout for PINN training
    layer_norm: true

  fno:
    hidden_dim: 256
    num_blocks: 4  # Number of spectral convolution blocks
    modes: 16  # Number of Fourier modes to keep (frequency cutoff); required for fno
    activation: "gelu"
    dropout: 0.0  # not read by FNONetwork

# Default PDE type to train
pde_type: "heat"  # Options: "heat", "heat_2d", "wave", "burgers", "convection", "kdv", "allen_cahn", "cahn_hilliard", "black_scholes", "pendulum"

# PDE-specific configurations
pde_configs:
  # Heat Equation Configuration
  heat:
    name: "Heat Equation"
    architecture: "fourier"
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      alpha: 0.01  # Thermal diffusivity DO NOT CHANGE
    domain: [[0, 2]]
    time_domain: [0, 10]
    dimension: 1
    initial_condition:
      type: "sin_exp_decay"
      amplitude: 1.0
      frequency: 2.0  # k: periods over the domain length L, u0 = A sin(2 pi k x / L)
    boundary_conditions:
      periodic: {}  # Periodic boundary conditions
      #dirichlet: { value: 0.0 }
    exact_solution:
      type: "sin_exp_decay"

  # Wave Equation Configuration
  wave:
    name: "Wave Equation"
    architecture: "siren"  # Excellent for capturing oscillations and wave patterns
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      c: 1.0  # Wave speed
    domain: [[0.0, 1.0]]
    time_domain: [0.0, 1.0]
    dimension: 1
    initial_condition:
      type: "sine"  # standing wave A sin(k pi x) released from rest
      amplitude: 1.0
      frequency: 1.0
      velocity: 0.0  # u_t(x, 0)
    boundary_conditions:
      dirichlet:
        type: "fixed"
        value: 0.0
    exact_solution:
      type: "sine"
  
  # Burgers Equation Configuration
  burgers:
    name: "Burgers Equation"
    architecture: "resnet"  # Good for nonlinear problems with discontinuities (shocks)
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      nu: 0.01  # Viscosity coefficient
    domain: [[-1.0, 1.0]]
    time_domain: [0.0, 1.0]
    dimension: 1
    initial_condition:
      type: "sine"
      amplitude: -1.0
      frequency: 1.0
    boundary_conditions:
      dirichlet:
        type: "fixed"
        value: 0.0
    exact_solution:
      type: "cole_hopf"  # Cole-Hopf integral for the sine IC and nu above
  
  # Convection Equation Configuration
  convection:
    name: "Convection Equation"
    architecture: "fourier"  # Good for transport problems with high frequencies
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      velocity: [1.0]  # Convection velocity vector [vx]
    domain: [[0.0, 2.0]]
    time_domain: [0.0, 1.0]
    dimension: 1
    initial_condition:
      type: "sin"
      amplitude: 1.0
      frequency: 1.0
    boundary_conditions:
      periodic: {}
    exact_solution:
      type: "sin"  # the IC transported with the velocity: u0(x - v t)
  
  # KdV Equation Configuration
  kdv:
    name: "KdV Equation"
    architecture: "siren"  # Ideal for solitons and nonlinear wave patterns
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      alpha: 6.0  # Nonlinear coefficient
      beta: 1.0   # Dispersion coefficient
    domain: [[-15.0, 15.0]]
    time_domain: [0.0, 5.0]
    dimension: 1
    initial_condition:
      type: "soliton"
      speed: 1.0  # soliton speed c (amplitude 3c/alpha)
    boundary_conditions:
      dirichlet:
        type: "fixed"
        value: 0.0
    exact_solution:
      type: "soliton"  # (3c/alpha) sech^2(0.5 sqrt(c/beta) (x - c t))
  
  # Allen-Cahn Equation Configuration
  allen_cahn:
    name: "Allen-Cahn Equation"
    architecture: "fourier"  # Good for problems with sharp interfaces
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      epsilon: 0.1  # Interface width parameter
      reaction_rate: 1.0  # Reaction rate
    domain: [[-1.0, 1.0]]
    time_domain: [0.0, 1.0]
    dimension: 1
    initial_condition:
      type: "tanh"  # stationary kink tanh(x / (sqrt(2) epsilon))
    boundary_conditions:
      dirichlet:
        type: "exact"  # u = -1 / +1 tails taken from the kink
    exact_solution:
      type: "tanh"
  
  # Cahn-Hilliard Equation Configuration
  cahn_hilliard:
    name: "Cahn-Hilliard Equation"
    architecture: "resnet"  # Good for higher-order problems with phase separation
    input_dim: 2  # (x, t)
    output_dim: 1  # u(x,t)
    parameters:
      mobility: 1.0  # Mobility coefficient
      kappa: 0.01  # Interface energy coefficient
    domain: [[-1.0, 1.0]]
    time_domain: [0.0, 1.0]
    dimension: 1
    initial_condition:
      type: "tanh"  # stationary kink tanh(x / sqrt(2 kappa)); "random" for spinodal runs
    boundary_conditions:
      dirichlet:
        type: "exact"
      neumann:
        type: "zero"  # 4th order: u and u_x on each face
    exact_solution:
      type: "tanh"
  
  # Black-Scholes Equation Configuration
  black_scholes:
    name: "Black-Scholes Equation"
    architecture: "feedforward"  # Simple and effective for this type of problem
    input_dim: 2  # (S, t)
    output_dim: 1  # V(S,t)
    parameters:
      sigma: 0.2  # Volatility
      r: 0.05  # Risk-free interest rate
    domain: [[0.0, 200.0]]  # Stock price domain
    time_domain: [0.0, 1.0]  # Time to maturity (years)
    dimension: 1
    initial_condition:
      type: "option"
      strike: 100.0
      option_type: "call"
    boundary_conditions:
      dirichlet:
        type: "exact"  # V(0, tau) = 0, V(S_max, tau) from the closed form
    exact_solution:
      type: "black_scholes"  # closed-form price of the option in initial_condition
  
  # Pendulum Equation Configuration
  pendulum:
    name: "Pendulum Equation"
    architecture: "resnet"  # Good for nonlinear dynamics and oscillatory behavior
    input_dim: 2  # (dummy x, t)
    output_dim: 1  # angular position
    parameters:
      g: 9.81  # Gravitational constant
      L: 1.0   # Pendulum length
      damping: 0.1  # Damping coefficient
    domain: [[0.0, 1.0]]  # dummy spatial input; theta depends on t only
    time_domain: [0.0, 10.0]
    dimension: 1
    initial_condition:
      type: "small_angle"
      initial_angle: 0.5  # theta(0), radians
      velocity: 0.0       # theta'(0)
    boundary_conditions:
      periodic: {}  # theta does not depend on the dummy coordinate
    exact_solution:
      type: "ode"  # full nonlinear damped trajectory (scipy, rtol 1e-11)

  # Heat Equation 2D Configuration
  heat_2d:
    name: "Heat Equation 2D"
    architecture: "fourier"
    input_dim: 3  # (x, y, t)
    output_dim: 1  # u(x,y,t)
    parameters:
      alpha: 0.01  # Thermal diffusivity
    domain: [[0, 1], [0, 1]]  # sin(2 pi x) sin(2 pi y) vanishes on the faces
    time_domain: [0, 5]
    dimension: 2
    initial_condition:
      type: "sine_2d"
      amplitude: 1.0
      frequency_x: 2.0
      frequency_y: 2.0
    boundary_conditions:
      dirichlet:
        type: "fixed"
        value: 0.0
    exact_solution:
      type: "sine_2d"

# Training Configuration
training:
  num_epochs: 3000  # for better convergence
  batch_size: 2048  # Larger batch size: should be divisible by 8 (ideally a power of 2: 32, 64, 128, 256, 512, 1024, 2048)
  num_collocation_points: 5000 #better coverage
  num_boundary_points: 5000  #better boundary enforcement
  num_initial_points: 5000  #better initial condition representation
  collocation_distribution: "uniform"  # Options: "uniform", "stratified", "residual_based" (RAD), "adaptive" (RL bandit, experimental)
  adaptive_weights:
    enabled: false # Whether to use adaptive weights for loss terms
    strategy: "rbw"  # Options: "lrw" (weights ~ 1 / EMA gradient norm) or "rbw" (weights ~ EMA loss); replaces loss_weights for residual/boundary/initial
    alpha: 0.7     # EMA retention; lower alpha adapts faster
    eps: 1.0e-6
    initial_weights: [0.3, 0.4, 0.3]  # [residual, boundary, initial] for the first step only
  validation_frequency: 10  # validate, log, check early stopping and checkpoint every N epochs
  early_stopping:
    enabled: true
    patience: 100  # epochs without val-loss improvement
    min_delta: 1.0e-7
  optimizer_config:
    learning_rate: 0.005  # Reduced for more stable training
    weight_decay: 0.0005  # Added weight decay for regularization
  # "cosine" anneals over num_epochs - warmup_epochs down to reduce_lr_params.min_lr;
  # "reduce_lr" is ReduceLROnPlateau on the epoch training loss; "constant" disables
  # scheduling. An optional training.warmup_epochs (default 0) ramps the LR linearly
  # first. L-BFGS replaces any non-constant scheduler with ReduceLROnPlateau.
  scheduler_type: "cosine"  # Options: "cosine" | "reduce_lr" | "constant"
  reduce_lr_params:
    factor: 0.5
    patience: 50
    min_lr: 1.0e-6
  loss_weights:
    residual: 15.0  # Weight for PDE residual loss
    boundary: 20.0  # Weight for boundary condition loss
    initial: 10.0   # Weight for initial condition loss
    data: 10.0      # Weight for data-fitting loss (any run with observation data)
  # forward: physics terms (+ data if observations are attached); inverse: physics +
  # data, also identifying selected PDE parameters; data_augmented: physics + data;
  # data_only: data term only.
  mode: "forward"  # Options: "forward" | "inverse" | "data_only" | "data_augmented"
  optimizer: "adam"  # Options: "adam" | "lbfgs" | "adam_lbfgs"
  adam_lbfgs_switch_ratio: 0.7  # Fraction of epochs in the Adam phase before switching to L-BFGS
  loss_function: "mse"  # Options: "mse" | "mae" | "huber"
  huber_delta: 1.0      # Delta for Huber loss (only used when loss_function = huber)
  lbfgs:  # passed to torch.optim.LBFGS
    history_size: 50
    max_iter: 20
    line_search_fn: "strong_wolfe"
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9

# Reinforcement Learning Configuration
rl:
  # Experimental residual-bandit collocation sampler (``--rl``; 1-D PDEs).
  # A DQN with gamma=0 learns which (x, t) cells carry high residual.
  enabled: false
  n_x_cells: 16
  n_t_cells: 8
  policy_fraction: 0.5  # share of points from the learned policy; rest uniform
  temperature: 0.5      # softmax temperature on Q-values
  probe_cells: 32       # cells probed per update
  probe_points: 8       # residual evaluations per probed cell
  probe_every: 10       # update the bandit every N batches

# Paths
paths:
  results_dir: "runs"  # relative to the working directory (./runs/); gitignored; experiments/ holds tracked research
