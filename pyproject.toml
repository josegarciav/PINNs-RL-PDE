[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pinnrl"
version = "0.3.1"
description = "Physics-informed neural networks for forward and inverse PDE problems, with adaptive collocation sampling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Garcia", email = "jgarciaventura23@gmail.com" },
]
keywords = [
    "physics-informed neural networks",
    "PINNs",
    "partial differential equations",
    "PDE",
    "reinforcement learning",
    "scientific machine learning",
    "deep learning",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "plotly>=5.15.0",
    "dash>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "pre-commit>=3.4.0",
    "twine>=5.0.0",
]
# Kept so `pip install 'pinnrl[viz]'` keeps working; the dashboard now ships in the core install.
viz = []
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "nbformat>=5.9.0",
]
docs = [
    "mkdocs>=1.5.0,<2",  # Material for MkDocs does not support MkDocs 2.0
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]
well = [
    "the_well>=1.0.0",
    "h5py>=3.10.0",
    "huggingface-hub>=0.20.0",
]
# Everything a user might want; development tools stay in `dev`.
all = [
    "pinnrl[notebooks,docs,well]",
]

[project.urls]
Homepage = "https://github.com/josegarciav/PINNs-RL-PDE"
Documentation = "https://github.com/josegarciav/PINNs-RL-PDE/tree/main/docs"
Repository = "https://github.com/josegarciav/PINNs-RL-PDE"
Issues = "https://github.com/josegarciav/PINNs-RL-PDE/issues"
Changelog = "https://github.com/josegarciav/PINNs-RL-PDE/blob/main/CHANGELOG.md"

[project.scripts]
pinnrl-train = "pinnrl.training.train:main"
pinnrl-benchmark = "pinnrl.benchmarks.cli:main"
pinnrl-dashboard = "pinnrl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["pinnrl"]

[tool.hatch.build.targets.sdist]
include = [
    "pinnrl/",
    "tests/",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "pre-commit>=3.4.0",
    "pinnrl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, and Google-style docstrings
select = ["E", "F", "W", "I", "B", "UP", "D"]
# E501: the formatter owns line length. D105/D107: Google style documents the
# constructor in the class docstring (mkdocstrings merges __init__ into the class).
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"experiments/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["pinnrl"]

[tool.coverage.run]
source = ["pinnrl"]
omit = [
    "pinnrl/dashboard.py",
    "pinnrl/main.py",
    "pinnrl/training/train.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.uv.sources]
pinnrl = { workspace = true }
