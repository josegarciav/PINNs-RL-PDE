name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Tests (coverage gate on 3.12)
        run: >
          uv run pytest -q
          ${{ matrix.python-version == '3.12' && '--cov=pinnrl --cov-report=term-missing --cov-fail-under=80' || '' }}

  lint:
    name: Lint, format, lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra docs
      - run: uv run mkdocs build --strict

  wheel-smoke:
    name: Clean-wheel release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: scripts/verify_release.sh 3.12
        env:
          SKIP_NOTEBOOKS: all   # PR speed; the release workflow and the local gate run them

  commit-message:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: |
      !contains(github.actor, '[bot]') &&
      !contains(github.event.head_commit.message, 'Co-Authored-By: Claude')
    steps:
      - uses: actions/checkout@v5
      - uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^(feat|fix|docs|style|refactor|perf|test|chore|merge)(\(.+\))?: .+'
          flags: 'i'
          error: 'Commit message must follow Conventional Commits: feat|fix|docs|style|refactor|perf|test|chore'
