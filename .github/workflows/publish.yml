name: Publish to PyPI

# Runs when a GitHub Release is published. Uploads via PyPI trusted publishing
# (OIDC): no API token is stored. One-time setup on pypi.org → pinnrl → Publishing:
# owner josegarciav, repository PINNs-RL-PDE, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Release gate (clean wheel, every entry point)
        run: scripts/verify_release.sh 3.12
        env:
          # needs network access to Hugging Face; run it in the local gate before tagging
          SKIP_NOTEBOOKS: 04_well_dataset_quickstart.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pinnrl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
